
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDT Miner</title>
<style>
body {
  margin:0;
  background:#101820;
  color:white;
  font-family:Arial;
  text-align:center;
}
h1 {color:#26a17b;margin-top:35px}
.balance {
  font-size:34px;
  color:#26d9a0;
  margin:25px;
}
.coin {
  width:190px;
  height:190px;
  margin:35px auto;
  border-radius:50%;
  background:linear-gradient(145deg,#26d9a0,#087d5b);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  font-weight:bold;
  box-shadow:0 0 35px #26a17b;
  cursor:pointer;
  user-select:none;
}
button {
  background:#26a17b;
  color:white;
  border:0;
  padding:15px 35px;
  border-radius:12px;
  font-size:18px;
}
</style>
</head>
<body>
<h1>USDT MINER</h1>
<p>DEMO MINING GAME</p>
<div class="balance"><span id="balance">0.0000</span> USDT</div>
<div class="coin" onclick="mine()">₮</div>
<p>Tap the coin to mine!</p>
<button onclick="mine()">MINING</button>
<p id="message">Demo balance only</p>
<script>
let balance = 0;
function mine() {
 balance += 0.0001;
 document.getElementById("balance").innerText =
 balance.toFixed(4);
}
</script>
</body>
</html>
